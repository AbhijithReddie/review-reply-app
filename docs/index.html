<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply to a customer review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF2EF;
    --sheet: #FFFFFF;
    --ink: #1D2A26;
    --muted: #5B6B66;
    --line: #D3DCD7;
    --teal: #1F6F5C;
    --teal-dark: #17594A;
    --star: #D99A1E;
    --error: #A63D2F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.55 "Figtree", system-ui, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 56px 24px 72px; }
  h1 { font-size: 2.25rem; line-height: 1.15; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  .intro { margin: 0 0 40px; color: var(--muted); max-width: 60ch; }

  .layout { display: grid; grid-template-columns: 5fr 6fr; gap: 32px; align-items: start; }

  form { display: grid; gap: 28px; }
  .field-label { display: block; font-weight: 600; margin-bottom: 10px; }

  .stars { display: flex; gap: 6px; border: 0; padding: 0; margin: 0; }
  .stars legend { font-weight: 600; margin-bottom: 10px; padding: 0; }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars label { cursor: pointer; line-height: 0; border-radius: 8px; padding: 2px; }
  .stars svg { width: 44px; height: 44px; fill: none; stroke: var(--star); stroke-width: 1.6; transition: fill 120ms; }
  .stars label.on svg { fill: var(--star); }
  .stars input:focus-visible + label { outline: 3px solid var(--teal); outline-offset: 2px; }
  .rating-note { margin: 8px 0 0; font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
  .rating-note.warn { color: var(--error); }

  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--sheet);
    color: var(--ink);
    font: inherit;
  }
  textarea:focus-visible { outline: 3px solid var(--teal); outline-offset: 1px; border-color: transparent; }
  .count { margin: 6px 0 0; font-size: 0.85rem; color: var(--muted); text-align: right; }

  button {
    font: 600 1rem "Figtree", system-ui, sans-serif;
    border-radius: 10px;
    cursor: pointer;
  }
  .primary { justify-self: start; padding: 13px 26px; border: 0; background: var(--teal); color: #FFFFFF; }
  .primary:hover { background: var(--teal-dark); }
  .primary:disabled { background: #9DB3AC; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .letter {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px 40px;
    min-height: 360px;
    box-shadow: 0 14px 30px -18px rgba(29, 42, 38, 0.35);
  }
  .letter .empty { color: var(--muted); margin: 0; }
  .letter .error { color: var(--error); margin: 0; }
  .subject { font: 600 1.15rem/1.35 "Literata", Georgia, serif; margin: 0 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .body { font: 400 1.05rem/1.7 "Literata", Georgia, serif; white-space: pre-wrap; margin: 0; }
  .copy { margin-top: 24px; padding: 9px 18px; background: transparent; color: var(--teal); border: 1px solid var(--teal); }
  .copy:hover { background: #E2ECE8; }
  .reveal { animation: reveal 380ms ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 820px) {
    main { padding-top: 36px; }
    h1 { font-size: 1.8rem; }
    .layout { grid-template-columns: 1fr; }
    .letter { padding: 28px 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; }
    .stars svg { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Reply to a customer review</h1>
  <p class="intro">Paste a 1- or 2-star review and choose its rating. You'll get a short, personalised apology email that addresses the customer's specific complaints.</p>

  <div class="layout">
    <form id="form">
      <div>
        <fieldset class="stars" id="stars">
          <legend>Rating</legend>
        </fieldset>
        <p class="rating-note" id="rating-note" aria-live="polite">Choose how many stars the customer gave.</p>
      </div>

      <div>
        <label class="field-label" for="review">Customer review</label>
        <textarea id="review" maxlength="2000" required placeholder="e.g. My order arrived an hour late and two items were missing…"></textarea>
        <p class="count"><span id="count">0</span> / 2,000</p>
      </div>

      <button class="primary" id="submit" type="submit" disabled>Write reply</button>
    </form>

    <section class="letter" id="output" aria-live="polite" aria-label="Generated reply">
      <p class="empty">Your reply will appear here.</p>
    </section>
  </div>
</main>

<script>
  // Set this to your Render service URL after deploying the backend.
  const API_URL = "https://review-reply-api-zk3z.onrender.com";

  const starPath = "M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z";
  const stars = document.getElementById("stars");
  const note = document.getElementById("rating-note");
  const review = document.getElementById("review");
  const count = document.getElementById("count");
  const submit = document.getElementById("submit");
  const output = document.getElementById("output");
  let rating = 0;

  for (let i = 1; i <= 5; i++) {
    stars.insertAdjacentHTML("beforeend",
      `<input type="radio" name="rating" id="star-${i}" value="${i}">
       <label for="star-${i}" aria-label="${i} star${i > 1 ? "s" : ""}">
         <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${starPath}"/></svg>
       </label>`);
  }
  const labels = [...stars.querySelectorAll("label")];
  const paint = (n) => labels.forEach((l, i) => l.classList.toggle("on", i < n));

  labels.forEach((label, i) => {
    label.addEventListener("mouseenter", () => paint(i + 1));
    label.addEventListener("mouseleave", () => paint(rating));
  });

  stars.addEventListener("change", (e) => {
    rating = Number(e.target.value);
    paint(rating);
    const ok = rating <= 2;
    note.textContent = ok ? `${rating} of 5 stars` : "Replies are only drafted for 1- and 2-star reviews.";
    note.classList.toggle("warn", !ok);
    updateButton();
  });

  review.addEventListener("input", () => {
    count.textContent = review.value.length.toLocaleString();
    updateButton();
  });

  function updateButton() {
    submit.disabled = !(rating >= 1 && rating <= 2 && review.value.trim());
  }

  function showMessage(text, cls) {
    output.innerHTML = "";
    const p = document.createElement("p");
    p.className = cls;
    p.textContent = text;
    output.appendChild(p);
  }

  function showEmail(email) {
    const lines = email.trim().split("\n");
    let subject = "";
    if (/^subject:/i.test(lines[0])) subject = lines.shift().replace(/^subject:\s*/i, "");

    output.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "reveal";
    if (subject) {
      const h = document.createElement("h2");
      h.className = "subject";
      h.textContent = subject;
      wrap.appendChild(h);
    }
    const body = document.createElement("p");
    body.className = "body";
    body.textContent = lines.join("\n").trim();
    wrap.appendChild(body);

    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "copy";
    copy.textContent = "Copy reply";
    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(email.trim());
      copy.textContent = "Copied";
      setTimeout(() => (copy.textContent = "Copy reply"), 2000);
    });
    wrap.appendChild(copy);
    output.appendChild(wrap);
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    submit.disabled = true;
    submit.textContent = "Writing reply…";
    showMessage("Writing the reply. The first request after a quiet period can take up to a minute while the server starts.", "empty");

    try {
      const res = await fetch(`${API_URL}/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ review: review.value, rating }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 429) showMessage("Too many requests. Wait a minute and try again.", "error");
      else if (!res.ok) showMessage(data.error || "The server couldn't write a reply. Try again in a moment.", "error");
      else showEmail(data.email);
    } catch {
      showMessage("Couldn't reach the server. Check your connection and the API_URL setting, then try again.", "error");
    }

    submit.textContent = "Write reply";
    updateButton();
  });
</script>
</body>
</html>
